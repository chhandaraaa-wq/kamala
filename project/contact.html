<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>ទំនាក់ទំនង - ទេសចរណ៍កម្ពុជា</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">VisitCambodia</div>
        <nav>
            <ul>
                <li><a href="index.html">ទំព័រដើម</a></li>
                <li><a href="angkor.html">អង្គរវត្ត</a></li>
                <li><a href="kohrong.html">កោះរ៉ុង</a></li>
                <li><a href="mondulkiri.html">មណ្ឌលគិរី</a></li>
                 <li><a href="tips.html" class="active">ការណែនាំអ្នកដំណើរ</li>
                <li><a href="contact.html">ទំនាក់ទំនង</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 style="text-align: center; margin-bottom: 20px;">ទាក់ទងយើងខ្ញុំ</h2>
        <div class="contact-form">
            <form action="#">
                <div class="form-group">
                    <label>ឈ្មោះរបស់អ្នក</label>
                    <input type="text" placeholder="បញ្ចូលឈ្មោះ..." required>
                </div>
                <div class="form-group">
                    <label>អ៊ីមែល</label>
                    <input type="email" placeholder="បញ្ចូលអ៊ីមែល..." required>
                </div>
                <div class="form-group">
                    <label>សាររបស់អ្នក</label>
                    <textarea rows="5" placeholder="សរសេរសារនៅទីនេះ..."></textarea>
                </div>
                <button type="submit" class="btn" style="border:none; cursor:pointer;">ផ្ញើសារ</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Website ទេសចរណ៍កម្ពុជា</p>
    </footer>
</body>
</html>
